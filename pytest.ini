[pytest]
testpaths = tests
addopts = -m "not network and not speech and not browser"
markers =
    network: needs real access to YouTube (run with: pytest -m network)
    speech: runs the real faster-whisper tiny model (run with: VIDEOCAP_SPEECH_TESTS=1 pytest -m speech)
    browser: opens a real Chromium-based browser without a window (run with: pytest -m browser)
filterwarnings =
    ignore::DeprecationWarning
