name: Streamlit Deploy Health

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://tronclass-videocap.streamlit.app/
      APP_HEALTH_URL: https://tronclass-videocap.streamlit.app/_stcore/health
      LEGACY_SHARE_URL: https://share.streamlit.io/jackalcn/TronClassVideoCap/main/main.py

    steps:
      - name: Check deployed Streamlit endpoints
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          app_url = os.environ["APP_URL"]
          app_health_url = os.environ["APP_HEALTH_URL"]
          legacy_share_url = os.environ["LEGACY_SHARE_URL"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(url: str):
              opener = urllib.request.build_opener(NoRedirect)
              req = urllib.request.Request(url, headers={"User-Agent": "GitHubActions/StreamlitHealth"})
              try:
                  with opener.open(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", "ignore")
                      return resp.status, resp.headers, body
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "ignore")
                  return exc.code, exc.headers, body

          def assert_redirect(url: str) -> None:
              status, headers, body = request(url)
              location = headers.get("Location", "")
              print(f"redirect probe url={url} status={status} location={location}")
              if status not in {302, 303}:
                  raise SystemExit(f"Expected redirect for {url}, got status={status} body={body[:200]!r}")
              if "share.streamlit.io/-/auth/app" not in location:
                  raise SystemExit(f"Unexpected redirect target for {url}: {location}")

          def assert_share_entrypoint() -> None:
              status, headers, body = request(legacy_share_url)
              location = headers.get("Location", "")
              print(f"share probe status={status} location={location}")
              if status == 200:
                  lowered = body.lower()
                  if "streamlit" not in lowered and "hosted with streamlit" not in lowered:
                      raise SystemExit("Legacy share entrypoint did not look like a Streamlit response")
                  return
              if status in {302, 303} and "streamlit.app" in location:
                  return
              raise SystemExit(
                  f"Legacy share entrypoint unexpected status/location: status={status} location={location}"
              )

          deadline = time.time() + 600
          last_error = None
          while time.time() < deadline:
              try:
                  assert_share_entrypoint()
                  assert_redirect(app_url)
                  assert_redirect(app_health_url)
              except SystemExit as exc:
                  last_error = str(exc)
                  print(f"retrying after probe failure: {last_error}")
                  time.sleep(15)
                  continue

              print("Streamlit deployment health check passed")
              sys.exit(0)

          raise SystemExit(last_error or "Streamlit deployment health check failed")
          PY
