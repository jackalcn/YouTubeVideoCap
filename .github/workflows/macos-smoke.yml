name: macOS Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile main.py
        run: python -m py_compile main.py

      - name: macOS fallback smoke test
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import main

          assert sys.platform == "darwin", sys.platform

          js_runtime_available, js_runtime_status = main.get_js_runtime_status()
          assert js_runtime_available, js_runtime_status

          urls, rejected = main.parse_youtube_urls(
              "https://youtu.be/jNQXAC9IVRw youtube.com/watch?v=jNQXAC9IVRw "
              "https://example.com/v.mp4 https://youtube.com@example.com/ https://youtu.be/jNQXAC9IVRw"
          )
          assert urls == ["https://youtu.be/jNQXAC9IVRw", "https://youtube.com/watch?v=jNQXAC9IVRw"], urls
          assert len(rejected) == 2, rejected

          captured = {}
          post_processors = []
          dummy_output = Path("downloads") / "dummy.mp4"

          class DummyProgress:
              def progress(self, value, text=""):
                  pass

          class DummyYDL:
              def __init__(self, opts):
                  captured.update(opts)

              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, tb):
                  return False

              def add_post_processor(self, pp, when="post_process"):
                  post_processors.append(pp)

              def extract_info(self, url, download=True):
                  info = {"title": "dummy", "filepath": str(dummy_output.resolve()), "requested_subtitles": {}}
                  for pp in post_processors:
                      pp.run(info)
                  return info

          orig_status = main.get_ffmpeg_status
          orig_ydl = main.yt_dlp.YoutubeDL

          try:
              main.get_ffmpeg_status = lambda: (False, "mock missing")
              main.yt_dlp.YoutubeDL = DummyYDL

              dummy_output.parent.mkdir(parents=True, exist_ok=True)
              dummy_output.write_bytes(b"0")

              outcome = main.download_with_ytdlp(
                  "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                  main.DownloadOptions(
                      output_dir=Path("downloads"),
                      output_template="%(title)s.%(ext)s",
                      max_height=1080,
                      download_subtitles=True,
                      subtitle_languages=("all",),
                      subtitle_format="srt",
                      include_auto_subtitles=True,
                      embed_subtitles=True,
                      retry_count=1,
                  ),
                  DummyProgress(),
              )

              assert Path(outcome["items"][0]["path"]).name == "dummy.mp4", outcome
              assert captured.get("format") == "b[ext=mp4]/b", captured
              assert "merge_output_format" not in captured, captured
              assert "postprocessors" not in captured, captured
              assert len(post_processors) == 1, post_processors
              assert captured.get("subtitlesformat") == "srt/best", captured
              assert captured.get("writeautomaticsub") is False, captured
              print("macOS fallback smoke passed")
          finally:
              main.get_ffmpeg_status = orig_status
              main.yt_dlp.YoutubeDL = orig_ydl
          PY

      # GitHub-hosted runner IPs are often challenged by YouTube's bot check, so a failure here only warns.
      - name: macOS public YouTube download smoke
        continue-on-error: true
        run: |
          python - <<'PY'
          import shutil
          import sys
          import tempfile
          from pathlib import Path

          import main

          assert sys.platform == "darwin", sys.platform

          class DummyProgress:
              def progress(self, value, text=""):
                  pass

          workdir = Path(tempfile.mkdtemp(prefix="youtube-downloader-macos-public-"))

          orig_status = main.get_ffmpeg_status

          try:
              main.get_ffmpeg_status = lambda: (False, "mock missing")
              outcome = main.download_with_ytdlp(
                  "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                  main.DownloadOptions(
                      output_dir=workdir / "downloads",
                      output_template="%(title)s.%(ext)s",
                      retry_count=1,
                  ),
                  DummyProgress(),
              )

              assert outcome["items"], outcome["errors"]
              output_path = Path(outcome["items"][0]["path"])
              assert output_path.exists(), output_path
              assert output_path.suffix.lower() == ".mp4", output_path
              assert output_path.stat().st_size > 100_000, output_path.stat().st_size
              print(f"macOS public YouTube download passed: {output_path.name} ({output_path.stat().st_size} bytes)")
          finally:
              main.get_ffmpeg_status = orig_status
              shutil.rmtree(workdir, ignore_errors=True)
          PY
