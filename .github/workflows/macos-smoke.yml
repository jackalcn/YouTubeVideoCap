name: macOS Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q main.py videocap

      - name: Check the JavaScript runtime is found
        run: |
          python - <<'PY'
          import sys

          from videocap.tooling import get_js_runtime_status

          assert sys.platform == "darwin", sys.platform
          available, status = get_js_runtime_status()
          assert available, status
          PY

      # ffmpeg is left out on purpose, so this job also checks that the tests and the app work without it.
      - name: Run tests
        run: python -m pytest -q

      # GitHub-hosted runner IPs are often challenged by YouTube's bot check, so a failure here only warns.
      - name: macOS public YouTube download smoke
        continue-on-error: true
        run: |
          python - <<'PY'
          import shutil
          import sys
          import tempfile
          from pathlib import Path

          import videocap.downloader as downloader
          from videocap.options import DownloadOptions

          assert sys.platform == "darwin", sys.platform

          class DummyProgress:
              def progress(self, value, text=""):
                  pass

          workdir = Path(tempfile.mkdtemp(prefix="youtube-downloader-macos-public-"))

          # Without ffmpeg, the app must still get a usable single-file download.
          downloader.get_ffmpeg_status = lambda: (False, "mock missing")

          try:
              outcome = downloader.download_with_ytdlp(
                  "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                  DownloadOptions(
                      output_dir=workdir / "downloads",
                      output_template="%(title)s.%(ext)s",
                      retry_count=1,
                  ),
                  DummyProgress(),
              )

              assert outcome["items"], outcome["errors"]
              output_path = Path(outcome["items"][0]["path"])
              assert output_path.exists(), output_path
              assert output_path.suffix.lower() == ".mp4", output_path
              assert output_path.stat().st_size > 100_000, output_path.stat().st_size
              print(f"macOS public YouTube download passed: {output_path.name} ({output_path.stat().st_size} bytes)")
          finally:
              shutil.rmtree(workdir, ignore_errors=True)
          PY
